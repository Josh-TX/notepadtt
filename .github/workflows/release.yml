name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Verify frontend built
        run: test -f backend/internal/webui/dist/index.html

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Build binaries
        run: |
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME}"
          mkdir -p ../dist
          declare -A targets=(
            ["linux-amd64"]="linux/amd64"
            ["linux-arm64"]="linux/arm64"
            ["windows-amd64"]="windows/amd64"
            ["darwin-amd64"]="darwin/amd64"
            ["darwin-arm64"]="darwin/arm64"
          )
          for name in "${!targets[@]}"; do
            IFS='/' read -r OS ARCH <<< "${targets[$name]}"
            OUT="../dist/notepadtt-${name}"
            [ "$OS" = "windows" ] && OUT="${OUT}.exe"
            CGO_ENABLED=0 GOOS=$OS GOARCH=$ARCH go build \
              -trimpath \
              -tags embed_frontend \
              -ldflags="$LDFLAGS" \
              -o "$OUT" .
          done
        working-directory: backend

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  docker:
    runs-on: ubuntu-latest
    environment:
      name: docker-url
      url: https://hub.docker.com/r/joshtxdev/notepadtt
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: joshtxdev/notepadtt:latest,joshtxdev/notepadtt:${{ env.VERSION }}
